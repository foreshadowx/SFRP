# Dataset Related
num_points: 1024  # number of poins actually used in training and evaluation
dataset:
  common:
    NAME: FG3DPoint_Chair
    data_dir: './data/FG3DPoint/Chair_10000'
  train:
    split: train
    num_points: 1024  # in training, use sampled 1024 points for data augmentation. 
  val:
    split: test
    num_points: 1024  # in testing, use uniformly pre-sampled 1024 points for evaluation (following https://github.com/lulutang0608/Point-BERT)

feature_keys: pos

#datatransforms:
#  train: [PointsToTensor, PointCloudScaleAndTranslate, PointCloudRotation]  # rotation does not help
#  vote: [PointCloudScaleAndTranslate]
#  val: [PointsToTensor]
#  kwargs:
#    shift: [0.2, 0.2, 0.2]
#    scale: [ 0.9, 1.1 ]
#    angle: [ 0.0, 1.0, 0.0 ]

datatransforms:
  train: [PointsToTensor, PointCloudScaleAndTranslate]
  vote: [PointCloudScaleAndTranslate]
  val: [PointsToTensor]
  kwargs:
    scale: [0.8, 1.25]
    shift: [0.1, 0.1, 0.1]


batch_size: 24
dataloader:
  num_workers: 12

num_classes: 33
# ---------------------------------------------------------------------------- #
# Training cfgs
# ---------------------------------------------------------------------------- #
# training receipe borrowed from: https://github.com/yanx27/Pointnet_Pointnet2_pytorch

# ---------------------------------------------------------------------------- #
# Training cfgs
# ---------------------------------------------------------------------------- #
# this one is better. 
sched: cosine
epochs: 300
warmup_epochs: 0
min_lr: 1.0e-8
t_max: 250

# Training parameters
lr: 0.001
optimizer:
 NAME: 'adamw'
 weight_decay: 0.0001

grad_norm_clip: 1

criterion_args:
  NAME: SmoothCrossEntropy
  label_smoothing: 0.2

# ---------------------------------------------------------------------------- #
# io and misc
# ---------------------------------------------------------------------------- #
log_dir: 'FG3D_chair'
print_freq: 10
val_freq: 1

# ----------------- Model related
val_batch_size: 32
pretrained_path: null 

wandb:
  project: PointNeXt-ModelNet40Ply2048